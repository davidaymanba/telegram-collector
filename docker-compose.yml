services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: telegram_collector
      MYSQL_USER: collector
      MYSQL_PASSWORD: collector-dev-password
      MYSQL_ROOT_PASSWORD: root-dev-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot-dev-password"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  mysql_data:
  redis_data:
